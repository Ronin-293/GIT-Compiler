name: Build Xiaomi SM8250 Kernel (nosusfs)

on:
  workflow_dispatch:
    inputs:
      KERNEL_TREE:
        description: 'Kernel repository'
        default: 'https://github.com/kvsnr113/xiaomi_sm8250_kernel'
        required: true
      KERNEL_BRANCH:
        description: 'Kernel branch (nosusfs)'
        default: 'nosusfs'
        required: true
      ANYKERNEL_URL:
        description: 'AnyKernel3 repository URL'
        default: 'https://github.com/SenseiiX/AnyKernel3'
        required: true
      CUSTOM_SED:
        description: 'Custom Kernel Version'
        default: ''
        required: false
      VERSION:
        description: 'Zip Version'
        default: '1.0'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false

    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y flex libncurses6 bc wget unzip zip zstd

      - name: Cache Neutron Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-neutron
          key: clang-neutron-19-${{ hashFiles('**/clang-version') }}

      - name: Download Neutron Clang if not cached
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang-neutron
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang-neutron
          echo "neutron-10032024" > clang-version

      - name: Set Clang Path
        run: echo "CLANG_PATH=$(pwd)/clang-neutron/bin" >> $GITHUB_ENV

      - name: Checkout Kernel
        run: |
          git clone --depth=1 --branch ${{ github.event.inputs.KERNEL_BRANCH }} ${{ github.event.inputs.KERNEL_TREE }} kernel

      - name: Build Kernel (FusionX style + fast build)
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="senx"
          export KBUILD_BUILD_HOST="ubuntu"
          export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC-7 date)"

          cd kernel
          make O=out vendor/munch_defconfig

          # Build kernel
          make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 || echo "Build failed, checking files..."

          # Debug: list output dir if fail
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found!"
            find out/arch/arm64/boot -type f
            exit 1
          fi
          if [ ! -f out/arch/arm64/boot/dtb.img ]; then
            echo "❌ DTB not found!"
            find out/arch/arm64/boot -type f
            exit 1
          fi

          # Copy files to AnyKernel
          mkdir -p ../AnyKernel3
          cp out/arch/arm64/boot/Image ../AnyKernel3/
          cp out/arch/arm64/boot/dtb.img ../AnyKernel3/

      - name: Clone AnyKernel3
        run: git clone --recursive --depth=1 ${{ github.event.inputs.ANYKERNEL_URL }} -b fusionX AnyKernel3

      - name: Copy kernel files to AnyKernel3
        run: |
          cp -r ../AnyKernel3/* AnyKernel3/

      - name: Define ZIP Name
        run: |
          export TZ='Asia/Manila'
          COMPILED_DATE=$(date +%Y%m%d)
          echo "ZIP_NAME=FusionX-nosusfs-${{ github.event.inputs.VERSION }}-$COMPILED_DATE" >> $GITHUB_ENV

      - name: Create ZIP file
        run: |
          cd AnyKernel3
          zip -r9 ../${{ env.ZIP_NAME }}.zip * -x .git* .github*

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip