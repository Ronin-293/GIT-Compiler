name: nosusfs-Kernel-Build

on:
  workflow_dispatch:
    inputs:
      KERNEL_TREE:
        description: 'Kernel Repository'
        default: 'https://github.com/kvsnr113/xiaomi_sm8250_kernel'
        required: true
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        default: 'nosusfs'
        required: true
      VERSION:
        description: 'Kernel Version'
        default: '1.0.0'
        required: false
      CLANG_TOOLCHAIN:
        description: 'Clang Toolchain'
        default: 'neutron'
        required: true
        type: choice
        options:
          - neutron

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false
    steps:
      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y flex libncurses6 bc bison build-essential zip

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-neutron
          key: clang-toolchain-${{ github.event.inputs.CLANG_TOOLCHAIN }}-${{ hashFiles('**/clang-version') }}
          restore-keys: clang-toolchain-${{ github.event.inputs.CLANG_TOOLCHAIN }}-

      - name: Download & Extract Clang (If not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang-neutron
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang-neutron
          echo "neutron-10032024" > clang-version

      - name: Set Clang Path
        run: echo "CLANG_PATH=$(pwd)/clang-neutron/bin" >> $GITHUB_ENV

      - name: Checkout Kernel
        run: git clone --depth=1 --branch "${{ github.event.inputs.KERNEL_BRANCH }}" "${{ github.event.inputs.KERNEL_TREE }}" kernel_tree

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="senx"
          export KBUILD_BUILD_HOST="ubuntu"
          export KBUILD_BUILD_TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M:%S")"
          cd kernel_tree
          make O=out munch_defconfig
          make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Check and Prepare Kernel Files for AnyKernel3
        run: |
          cd kernel_tree/out/arch/arm64/boot
          # Ensure Image exists
          if [ ! -f Image ]; then
            echo "❌ Kernel Image not found!"
            exit 1
          fi
          # Ensure dtb.img exists
          if [ ! -f dtb.img ]; then
            echo "❌ dtb.img not found!"
            exit 1
          fi
          # dtbo.img optional
          if [ ! -f dtbo.img ]; then
            echo "⚠ dtbo.img not found. Continuing without it."
          fi

          # Copy files to root for AnyKernel3
          cp Image ../../../../Image
          cp dtb.img ../../../../MUNCH-dtb.img
          if [ -f dtbo.img ]; then
            cp dtbo.img ../../../../MUNCH-dtbo.img
          fi

      - name: Clone Custom AnyKernel3
        run: git clone --recursive --depth=1 https://github.com/kvsnr113/AnyKernel3 -b master AnyKernel3

      - name: Copy Kernel Files to AnyKernel3
        run: |
          cp ../../Image AnyKernel3/
          cp ../../MUNCH-dtb.img AnyKernel3/
          if [ -f ../../MUNCH-dtbo.img ]; then
            cp ../../MUNCH-dtbo.img AnyKernel3/
          fi

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          ZIP_NAME=MUNCH-${{ github.event.inputs.VERSION }}-$(date +%Y%m%d)
          zip -r9 ../${ZIP_NAME}.zip * -x .git* .github*
          echo "Created ZIP: ${ZIP_NAME}.zip"

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: MUNCH-Kernel-Zip
          path: MUNCH-*.zip