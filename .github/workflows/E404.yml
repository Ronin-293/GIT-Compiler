name: Xiaomi SM8250 Kernel Build (Nosusfs)

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false

    steps:
      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y flex libncurses6 zip

      - name: Clone Kernel
        run: git clone --depth=1 --branch nosusfs https://github.com/kvsnr113/xiaomi_sm8250_kernel kernel

      - name: Setup Clang Toolchain
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang
          unzstd clang.tar.zst
          tar -xf clang.tar -C clang
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Kernel Config (Original Defconfig)
        run: |
          cd kernel
          make O=out vendor/munch_defconfig

      - name: Fast Build (Optional)
        run: |
          cd kernel
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="senx"
          export KBUILD_BUILD_HOST="ubuntu"
          make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 || echo "Build failed, checking files..."
          
          # Debug: List output directory if build fails
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found!"
            find out/arch/arm64/boot -type f
            exit 1
          fi
          if [ ! -f out/arch/arm64/boot/dtb.img ]; then
            echo "❌ DTB not found!"
            find out/arch/arm64/boot -type f
            exit 1
          fi

      - name: Prepare AnyKernel
        run: |
          git clone --depth=1 --branch fusionX https://github.com/SenseiiX/AnyKernel3 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/ || echo "DTB missing, skipping copy"

      - name: Create ZIP
        run: |
          cd AnyKernel3
          ZIP_NAME="nosusfs-kernel-$(date +%Y%m%d)"
          zip -r9 ../$ZIP_NAME.zip * -x .git* .github*
          echo "ZIP_NAME=$ZIP_NAME.zip" >> $GITHUB_ENV

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}