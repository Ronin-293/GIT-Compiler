name: Munch-NOSUSFS-Kernel-Build

on:
  workflow_dispatch:
    inputs:
      KERNEL_TREE:
        description: 'Kernel Repo URL'
        default: 'https://github.com/kvsnr113/xiaomi_sm8250_kernel'
        required: true
      KERNEL_TREE_BRANCH:
        description: 'Kernel Branch (nosusfs)'
        default: 'nosusfs'
        required: true
      VERSION:
        description: 'Kernel ZIP Version'
        default: '1.0.0'
        required: false
      CUSTOM_SED:
        description: 'Custom Kernel Version'
        default: '-NOSUSFS-1.0.0'
        required: false
      CLANG_TOOLCHAIN:
        description: 'Clang toolchain'
        default: 'neutron'
        required: true
        type: choice
        options:
          - neutron
      FAST_BUILD:
        description: 'Enable fast build (skip dtb build)'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false

    steps:
      - name: Install Dependencies
        run: sudo apt install -y flex libncurses6 bc bison curl

      - name: Clone Kernel
        run: |
          git clone --depth=1 --branch "${{ github.event.inputs.KERNEL_TREE_BRANCH }}" "${{ github.event.inputs.KERNEL_TREE }}" kernel_tree

      - name: Download & Extract Neutron Clang
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang-neutron
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang-neutron
          echo "neutron-10032024" > clang-version
          echo "CLANG_PATH=$(pwd)/clang-neutron/bin" >> $GITHUB_ENV

      - name: Kernel Version
        run: |
          cd kernel_tree
          if [[ "${{ github.event.inputs.CUSTOM_SED }}" != "-NOSUSFS-1.0.0" ]]; then
            sed -i -e "s/CONFIG_LOCALVERSION=\"-NOSUSFS-1.0.0\"/CONFIG_LOCALVERSION=\"${{ github.event.inputs.CUSTOM_SED }}\"/" arch/arm64/configs/vendor/munch_defconfig

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="senx"
          export KBUILD_BUILD_HOST="ubuntu"
          export KBUILD_BUILD_TIMESTAMP="$(date)"
          cd kernel_tree
          make O=out vendor/munch_defconfig
          if [[ "${{ github.event.inputs.FAST_BUILD }}" == 'true' ]]; then
            make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          else
            make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 dtbs
          fi

      - name: Verify Kernel Output
        run: |
          echo "Checking kernel output..."
          ls -l kernel_tree/out/arch/arm64/boot

      - name: Copy Kernel & DTB/DTBO to AnyKernel3
        run: |
          git clone --depth=1 https://github.com/kvsnr113/AnyKernel3 AnyKernel3
          cp kernel_tree/out/arch/arm64/boot/Image AnyKernel3/
          cp AnyKernel3/MUNCH-dtb AnyKernel3/
          cp AnyKernel3/MUNCH-dtbo.img AnyKernel3/
          echo "Files copied to AnyKernel3:"
          ls -l AnyKernel3/

      - name: Create Kernel ZIP
        run: |
          cd AnyKernel3
          export TZ='Asia/Manila'
          COMPILED_DATE=$(date +%Y%m%d)
          ZIP_NAME=[NOSUSFS]-${{ github.event.inputs.VERSION }}-$COMPILED_DATE
          zip -r9 ../${ZIP_NAME}.zip * -x .git* .github*
          echo "Created zip: ${ZIP_NAME}.zip"

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NOSUSFS-Kernel-ZIP
          path: *.zip