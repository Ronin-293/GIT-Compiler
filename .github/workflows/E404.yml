name: Build Xiaomi SM8250 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_TREE: 'https://github.com/kvsnr113/xiaomi_sm8250_kernel'
      KERNEL_BRANCH: 'nosusfs'
      ANYKERNEL_URL: 'https://github.com/SenseiiX/AnyKernel3'
      CLANG_TOOLCHAIN: 'neutron'

    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y flex libncurses6 wget tar zstd zip

      - name: Clone Kernel
        run: git clone --depth=1 --branch $KERNEL_BRANCH $KERNEL_TREE kernel

      - name: Download Neutron Clang
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir clang-neutron
          unzstd clang.tar.zst
          tar -xf clang.tar -C clang-neutron
          echo "Neutron clang ready"

      - name: Set Clang Path
        run: echo "CLANG_PATH=$(pwd)/clang-neutron/bin" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="senx"
          export KBUILD_BUILD_HOST="ubuntu"
          cd kernel
          make O=out vendor/munch_defconfig
          make O=out CC=clang -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Clone AnyKernel3
        run: git clone --depth=1 --branch fusionX $ANYKERNEL_URL AnyKernel3

      - name: Copy Kernel and DTBs
        run: |
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/dtbs
          cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/dtbs/

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../xiaomi_kernel.zip * -x .git* .github*

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi_kernel
          path: xiaomi_kernel.zip