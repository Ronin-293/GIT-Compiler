name: NOSUSFS Kernel Build

on:
  workflow_dispatch:
    inputs:
      FAST_BUILD:
        description: 'Enable fast build (only kernel Image + dtbs)'
        required: false
        type: boolean
        default: false
      VERSION:
        description: 'Zip Version'
        default: '1.0'
        required: false
      ANYKERNEL_URL:
        description: 'AnyKernel Url'
        default: 'https://github.com/SenseiiX/AnyKernel3'
        required: false
      CUSTOM_SED:
        description: 'Custom Kernel Version'
        default: '-NOSUSFS-1.0'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false

    steps:
      - name: Install Dependencies
        run: sudo apt install -y flex libncurses6 bc bison build-essential zip

      - name: Set Clang Path
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang-neutron
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang-neutron
          echo "CLANG_PATH=$(pwd)/clang-neutron/bin" >> $GITHUB_ENV

      - name: Checkout Kernel
        run: |
          git clone --depth=1 -b nosusfs https://github.com/kvsnr113/xiaomi_sm8250_kernel kernel

      - name: Apply Custom Version
        run: |
          cd kernel
          sed -i -e "s/CONFIG_LOCALVERSION=\"-NOSUSFS-1.0\"/CONFIG_LOCALVERSION=\"${{ github.event.inputs.CUSTOM_SED }}\"/" arch/arm64/configs/vendor/munch_defconfig

      - name: Kernel Build
        run: |
          cd kernel
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="lordputin"
          export KBUILD_BUILD_HOST="ubuntu"
          export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC-7 date)"
          
          make O=out vendor/munch_defconfig
          
          if [[ "${{ github.event.inputs.FAST_BUILD }}" == "true" ]]; then
              echo "Fast build enabled: only Image + dtbs"
              make O=out CC=clang -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 dtbs
              make O=out CC=clang -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 Image
          else
              make O=out CC=clang -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          fi

      - name: Check if dtb.img exists
        run: |
          cd kernel/out/arch/arm64/boot
          if [ ! -f dtb.img ]; then
            echo "dtb.img not found, building dtbs..."
            make O=../../.. dtbs CC=clang -j$(nproc) LLVM=1 LLVM_IAS=1
          fi
          ls -lh

      - name: Move Artifacts FusionX Style
        run: |
          cd kernel/out/arch/arm64/boot
          cp Image ../../../
          mv dtb.img ../../../munch-dtb.img
          [ -f dtbo.img ] && mv dtbo.img ../../../munch-dtbo.img || echo "No dtbo.img found"

      - name: AnyKernel3 Packaging
        run: |
          git clone --depth=1 --recursive ${{ github.event.inputs.ANYKERNEL_URL }} AnyKernel3
          cp Image AnyKernel3/
          cp munch-dtb.img AnyKernel3/
          [ -f munch-dtbo.img ] && cp munch-dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../NOSUSFS-${{ github.event.inputs.VERSION }}.zip *
          
      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NOSUSFS-${{ github.event.inputs.VERSION }}
          path: NOSUSFS-${{ github.event.inputs.VERSION }}.zip