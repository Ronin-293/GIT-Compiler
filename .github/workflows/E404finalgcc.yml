name: GCC-MUNCH-Kernel-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y flex libncurses6 bison build-essential git wget unzip zstd

      # ------------------------------
      # DOWNLOAD PROTON GCC TOOLCHAINS
      # ------------------------------
      - name: Download Proton GCC Toolchains
        run: |
          mkdir gcc64 gcc32

          echo "Downloading Proton GCC (aarch64)..."
          wget https://github.com/kdrag0n/proton-gcc/archive/refs/heads/master.zip -O gcc64.zip
          unzip gcc64.zip
          mv proton-gcc-master/* gcc64/

          echo "Downloading Proton GCC ARM32..."
          wget https://github.com/kdrag0n/proton-gcc-arm/archive/refs/heads/master.zip -O gcc32.zip
          unzip gcc32.zip
          mv proton-gcc-arm-master/* gcc32/

          echo "GCC toolchains ready."

          echo "GCC64=$(pwd)/gcc64/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "GCC32=$(pwd)/gcc32/bin/arm-linux-gnueabi-" >> $GITHUB_ENV

      # ------------------------------
      # KERNEL SOURCE + SUSFS PICK
      # ------------------------------
      - name: Checkout Kernel Tree
        run: |
          git clone --depth=1 https://github.com/kvsnr113/xiaomi_sm8250_kernel -b gcc-staging2 kernel_tree

      - name: Cherry-pick SUSFS-BPF Patch (Auto-Resolve)
        run: |
          cd kernel_tree
          git config user.email "bot@example.com"
          git config user.name "Build Bot"

          echo "Fetching SUSFS patch source repo..."
          git remote add susfs https://github.com/Kenskuyy-Prjkt/fusionX_sm8250
          git fetch susfs wip-susfs-bpf

          echo "Applying cherry-pick..."
          git cherry-pick 2e62da287ea8c5436f2ca5770d6b3dafcf2c0ccc -X theirs || true

          # Auto fix conflicts
          if [ -d ".git/rebase-apply" ] || [ -f ".git/CHERRY_PICK_HEAD" ]; then
            echo "Conflicts detected — resolving using THEIR version…"
            git diff --name-only --diff-filter=U | xargs git checkout --theirs
            git add .
            git cherry-pick --continue || git commit -m "Auto-resolved SUSFS BPF cherry-pick"
          fi

          echo "Cherry-pick done."

      # ------------------------------
      # ANYKERNEL3
      # ------------------------------
      - name: Checkout AnyKernel3
        run: git clone --depth=1 https://github.com/kvsnr113/AnyKernel3 AnyKernel3

      - name: Clean Non-Munch Files from AnyKernel3
        run: |
          cd AnyKernel3
          echo "Cleaning Anything Not For MUNCH…"
          find . -type f ! -name 'MUNCH-dtb' \
                 ! -name 'MUNCH-dtbo.img' \
                 ! -name 'anykernel.sh' \
                 ! -name 'META-INF' ! -path './META-INF/*' \
                 -delete

          echo "Remaining files:"
          ls -lh

      # ------------------------------
      # BUILD KERNEL USING PURE GCC
      # ------------------------------
      - name: Build Kernel (GCC)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${GCC64}"
          export CROSS_COMPILE_ARM32="${GCC32}"
          export KBUILD_BUILD_USER="lordputin"
          export KBUILD_BUILD_HOST="ubuntu"

          cd kernel_tree

          echo "Using defconfig: vendor/munch_defconfig"
          make O=out vendor/munch_defconfig

          echo "⚙️ Starting GCC kernel build…"
          make O=out -j$(nproc)

          echo "Build output:"
          ls -lh out/arch/arm64/boot/

          # Copy Image → AnyKernel3
          cp out/arch/arm64/boot/Image ../AnyKernel3/MUNCH-Image

      # ------------------------------
      # FINAL FLASHABLE ZIP
      # ------------------------------
      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 "../MUNCH-Image.zip" * -x "*.git*" "*.github*"
          echo "Flashable ZIP created: MUNCH-Image.zip"

      # ------------------------------
      # ARTIFACT UPLOAD
      # ------------------------------
      - name: Upload Final Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: MUNCH-GCC-KERNEL
          path: MUNCH-Image.zip