name: Simple-MUNCH-Kernel-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: sudo apt install -y flex libncurses6 bison build-essential git wget unzip zstd

      - name: Download Neutron Clang
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Checkout Kernel Tree
        run: |
          git clone --depth=1 https://github.com/kvsnr113/xiaomi_sm8250_kernel -b nosusfs kernel_tree

      - name: Cherry-pick SUSFS-BPF Patch (Auto-Resolve)
        run: |
          cd kernel_tree
          git config user.email "bot@example.com"
          git config user.name "Build Bot"

          echo "Fetching external repo..."
          git remote add susfs https://github.com/SenX-Private-Space/fusionX_private4
          git fetch susfs ocuv

          echo "Applying cherry-pick..."
          git cherry-pick 98876c70b114b84c1b5279eda97856083c4253b0 -X theirs || true

          # Auto resolve conflicts (prefer NEW CHANGES)
          if [ -d ".git/rebase-apply" ] || [ -f ".git/CHERRY_PICK_HEAD" ]; then
            echo "Conflicts detected — resolving using THEIR version..."
            git diff --name-only --diff-filter=U | xargs git checkout --theirs
            git add .
            git cherry-pick --continue || git commit -m "Auto-resolved SUSFS-BPF cherry-pick using theirs"
          fi

          echo "Cherry-pick done with auto-merge."

      - name: Checkout AnyKernel3
        run: git clone --depth=1 https://github.com/kvsnr113/AnyKernel3 AnyKernel3

      - name: Clean Non-Munch Files from AnyKernel3
        run: |
          cd AnyKernel3
          echo "🧹 Removing non-MUNCH files..."
          find . -type f ! -name 'Image' ! -name 'MUNCH-Image' ! -name 'MUNCH-dtb' ! -name 'MUNCH-dtbo.img' \
                 ! -name 'anykernel.sh' ! -path './META-INF/*' -delete
          echo "Remaining files:"
          ls -lh
          
      - name: Setup SukiSU Ultra (KernelSU)
        run: |
          cd kernel_tree
          echo "🔧 Setting up SukiSU Ultra (KernelSU, no SUSFS)..."
          curl -LSs https://raw.githubusercontent.com/ApartTUSITU/SukiSU-Ultra/main/kernel/setup.sh | bash -s ApartTUSITU   

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="lordputin"
          export KBUILD_BUILD_HOST="ubuntu"

          cd kernel_tree
          make O=out vendor/munch_defconfig

          echo "⚙️ Compiling kernel..."
          make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          
          if [[ "${{ matrix.branch }}" != "NOKSU" ]]; then
            scripts/config --file out/.config \
              -e KSU \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -e THREAD_INFO_IN_TASK \
              -e KPM
          else
            scripts/config --file out/.config -d KSU
          fi
          
          make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          
          # ---- Apply SukiSU Ultra KPM Patch ----
          if [[ "${{ matrix.branch }}" != "NOKSU" ]]; then
            echo "Applying SukiSU Ultra patch..."
            cd out/arch/arm64/boot
            wget https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.12.2/patch_linux
            chmod +x patch_linux
            ./patch_linux
            rm Image
            mv oImage Image
            cd -
            fi
          # ------------------------------------

          echo "📁 Output:"
          ls -lh out/arch/arm64/boot/

          cp out/arch/arm64/boot/Image ../AnyKernel3/MUNCH-Image

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 "../MUNCH-Image.zip" * -x "*.git*" "*.github*"
          echo "Flashable ZIP created as MUNCH-Image.zip"

      - name: Upload Final Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: MUNCH-Image
          path: MUNCH-Image.zip