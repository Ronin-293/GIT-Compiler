name: MUNCH-NOSUSFS-Build-With-Custom-Anykernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: ARM64

    steps:
      - name: Install packages
        run: sudo apt update && sudo apt install -y flex libncurses6 bc bison build-essential git wget unzip zip zstd

      - name: Checkout kernel tree
        run: |
          # clone your kernel (adjust URL/branch if needed)
          git clone --depth=1 -b nosusfs https://github.com/kvsnr113/xiaomi_sm8250_kernel kernel_tree
          echo "Kernel checked out to: $PWD/kernel_tree"

      - name: Download & extract Neutron Clang
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang-neutron
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang-neutron
          echo "CLANG_PATH=$(pwd)/clang-neutron/bin" >> $GITHUB_ENV
          echo "Clang prepared at $PWD/clan g-neutron/bin"

      - name: Build kernel (vendor/munch_defconfig)
        env:
          PATH: ${{ env.CLANG_PATH }}:${{ env.PATH }}
        run: |
          set -e
          cd kernel_tree

          echo "Using defconfig: arch/arm64/configs/vendor/munch_defconfig"
          make O=out vendor/munch_defconfig

          echo "Starting kernel build (clang)..."
          make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

          echo "Build finished. Listing boot directory:"
          ls -lah out/arch/arm64/boot || true

          # show the exact expected Image path for debug
          echo "Kernel Image Path:"
          echo "$PWD/out/arch/arm64/boot/Image"

          # copy Image to repo root for next steps
          cp out/arch/arm64/boot/Image ../Image || ( echo "ERROR: Image missing!" && exit 1 )

      - name: Clone custom AnyKernel3 (kvsnr113)
        run: |
          # clone the custom AnyKernel3 that already contains MUNCH-dtb / MUNCH-dtbo.img
          git clone --depth=1 https://github.com/kvsnr113/AnyKernel3 AnyKernel3

          echo "AnyKernel3 repo contents:"
          ls -lah AnyKernel3 || true

      - name: Prepare AnyKernel3: copy Image + ensure MUNCH-dtb/dtbo present
        run: |
          set -e
          # working dir is repo root; Image is at ./Image (copied earlier)
          ANYKERNEL_DIR=AnyKernel3

          # required: Image
          if [ ! -f Image ]; then
            echo "ERROR: Kernel Image (./Image) not found. Aborting."
            exit 1
          fi

          # Copy the kernel Image into AnyKernel3
          cp Image "$ANYKERNEL_DIR/" || ( echo "ERROR copying Image to AnyKernel3" && exit 1 )

          # Try to find MUNCH-dtb and MUNCH-dtbo.img inside the cloned AnyKernel3 repo
          # (some repos keep them at top-level, or inside a folder). We'll search and copy if found.
          FOUND_DTB=""
          FOUND_DTBO=""

          # search for MUNCH-dtb (no extension) and MUNCH-dtbo.img
          if [ -f "$ANYKERNEL_DIR/MUNCH-dtb" ]; then
            FOUND_DTB="$ANYKERNEL_DIR/MUNCH-dtb"
          else
            # try recursive search (first match)
            FOUND_DTB="$(find $ANYKERNEL_DIR -maxdepth 3 -type f -name 'MUNCH-dtb' | head -n1 || true)"
          fi

          if [ -f "$ANYKERNEL_DIR/MUNCH-dtbo.img" ]; then
            FOUND_DTBO="$ANYKERNEL_DIR/MUNCH-dtbo.img"
          else
            FOUND_DTBO="$(find $ANYKERNEL_DIR -maxdepth 3 -type f -name 'MUNCH-dtbo.img' | head -n1 || true)"
          fi

          if [ -n "$FOUND_DTB" ]; then
            echo "Found MUNCH-dtb at: $FOUND_DTB"
            # if found outside top-level, copy into top-level so anykernel script finds it
            if [ "$FOUND_DTB" != "$ANYKERNEL_DIR/MUNCH-dtb" ]; then
              cp "$FOUND_DTB" "$ANYKERNEL_DIR/MUNCH-dtb"
            fi
          else
            echo "Warning: MUNCH-dtb not found in AnyKernel3 repo. If your installer requires it, zip may be incomplete."
          fi

          if [ -n "$FOUND_DTBO" ]; then
            echo "Found MUNCH-dtbo.img at: $FOUND_DTBO"
            if [ "$FOUND_DTBO" != "$ANYKERNEL_DIR/MUNCH-dtbo.img" ]; then
              cp "$FOUND_DTBO" "$ANYKERNEL_DIR/MUNCH-dtbo.img"
            fi
          else
            echo "Note: MUNCH-dtbo.img not found in AnyKernel3 repo — continuing (may be optional)."
          fi

          echo "Final AnyKernel3 top-level contents:"
          ls -lah $ANYKERNEL_DIR

      - name: Create flashable ZIP using custom AnyKernel3
        run: |
          set -e
          cd AnyKernel3
          # optional: make the anykernel scripts executable if needed
          if [ -f anykernel.sh ]; then chmod +x anykernel.sh || true; fi

          ZIP_NAME="MUNCH-${{ github.run_number }}-$(date +%Y%m%d%H%M)"
          echo "Creating zip: $ZIP_NAME.zip"
          zip -r9 ../${ZIP_NAME}.zip * -x .git* .github*
          echo "ZIP created at: $PWD/../${ZIP_NAME}.zip"

      - name: Upload flashable ZIP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: munch-flashable-zip
          path: |
            *.zip