name: Build MUNCH Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          libc6-dev libncurses5-dev libssl-dev curl zip unzip make git

    - name: Download Clang
      run: |
        mkdir -p clang
        cd clang
        wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
        unzip 20210522.zip
        mv proton-clang-20210522 proton
        cd ..

    - name: Build kernel
      env:
        PATH: ${{ github.workspace }}/clang/proton/bin:${PATH}
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang

        mkdir out
        
        # Vendor defconfig (important)
        make O=out vendor/munch_defconfig

        echo "🔧 Starting Kernel Build..."
        make -j$(nproc) O=out

        echo "✅ Kernel Build Completed!"
        echo "-----------------------------------"
        echo "Kernel Image path:"
        echo "$PWD/out/arch/arm64/boot/Image.gz-dtb"
        echo "-----------------------------------"

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: munch-kernel
        path: out/arch/arm64/boot/Image.gz-dtb