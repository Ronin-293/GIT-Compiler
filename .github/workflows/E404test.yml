name: Simple-MUNCH-Kernel-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: sudo apt install -y flex libncurses6 bison build-essential git wget unzip zstd

      - name: Download Neutron Clang
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst -O clang.tar.zst
          mkdir -p clang
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang
          echo "Clang extracted."

      - name: Set Clang Path
        run: echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Checkout Kernel Tree
        run: |
          git clone --depth=1 https://github.com/kvsnr113/xiaomi_sm8250_kernel -b nosusfs kernel_tree

      - name: Checkout Your AnyKernel3
        run: |
          git clone https://github.com/kvsnr113/AnyKernel3.git AnyKernel3

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="senx"
          export KBUILD_BUILD_HOST="ubuntu"

          cd kernel_tree

          echo "✔ Using defconfig: vendor/munch_defconfig"
          make O=out vendor/munch_defconfig

          echo "⚙️ Starting kernel compilation..."
          make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

          echo "📁 Build output directory:"
          ls -lh out/arch/arm64/boot/

          echo "---------------------------------------"
          echo "Kernel Image Path:"
          echo "$PWD/out/arch/arm64/boot/Image"
          echo "---------------------------------------"

          cp out/arch/arm64/boot/Image ../AnyKernel3/Image

      - name: Build Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 "Munch-Kernel.zip" * -x "*.git*"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MUNCH-Kernel-ZIP
          path: AnyKernel3/Munch-Kernel.zip